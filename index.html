<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QRIE | AR Pivot Test</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>body{margin:0;background:#101c23;color:#fff;font-family:system-ui,sans-serif}header{padding:16px 18px;font-size:20px;font-weight:700}model-viewer{width:100%;height:68dvh;background:linear-gradient(#344f5b,#172a32)}.panel{padding:15px 18px;line-height:1.65;font-size:14px}.hint{color:#c5d7dd}button{background:#19a888;color:#fff;border:0;border-radius:12px;padding:14px 24px;font-weight:700;font-size:16px}#ar-button{position:absolute;bottom:22px;left:50%;transform:translateX(-50%)}small{color:#b7c8d0}</style></head>
<body><header>QRIE — AR Pivot Test</header>
<model-viewer id="viewer" src="./cube_corner_origin.glb" alt="原点が左手前の床の角にある4m×4m×3mの立方体" camera-controls ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" shadow-intensity="1" exposure="1" interaction-prompt="none">
<button id="ar-button" slot="ar-button">ARで確認</button></model-viewer>
<div class="panel"><b>テストモデル：4m × 4m × 高さ3m</b><div class="hint">赤い印がモデル座標 (0,0,0) — 左手前・地面の角です。</div><div>ARで赤い印が配置位置と一致するか、Android / iPhoneで比較してください。</div><small>注意：Model Viewer のネイティブARはモデルを自動で中央揃えする場合があります。原点がARアンカーになる保証はありません。HTTPSで公開してテストしてください。</small></div>
</body></html>
